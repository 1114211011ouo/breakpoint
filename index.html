<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Box</title>
  <style>
    
    .box {
      width: 300px;
      height: 300px;
      max-width: 100%;
      background-color: #d64d4d;
      margin: 50px auto;
    }

    
    @media (max-width: 1200px) {
      .box {
        border-radius: 50%;
        background-color: #338ce6;
      }
    }

    
    @media (max-width: 800px) {
      .box {
        width: 300px;
        height: 150px;
        border-radius: 0;
        background-color: #dbc818;
      }
    }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
